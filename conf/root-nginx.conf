# Main config for remote: -p /root -c /root/nginx.conf
# Deploy: scp to nginx:/root/nginx.conf
#
# Layout on server:
#   /root/nginx.conf
#   /root/nginx/conf/mime.types
#   /root/nginx/conf/fabric-gateway.conf
#   /root/nginx/conf/spaces/*.conf
#
# Requires nginx with --with-http_auth_request_module and --with-http_ssl_module
# and fabric-lookupd on 127.0.0.1:8787

worker_processes  auto;

error_log  /dev/stderr info;
pid        nginx/logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       nginx/conf/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    log_format  console  '$remote_addr - $host [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent"';

    access_log  /dev/stdout console;

    upstream fabric_lookup {
        server 127.0.0.1:8787;
        keepalive 8;
    }

    server {
        listen       80 default_server;
        server_name  localhost;
        return       444;
    }

    server {
        listen       80;
        server_name  nostrops.space;

        root   /var/www/nostrops-space;
        index  index.html index.htm;

        location / {
            try_files $uri $uri/ =404;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /var/www/nostrops-space;
        }
    }

    server {
        listen       80;
        server_name  trustedfilter.net *.trustedfilter.net;

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }

    server {
        listen       80;
        server_name  extra@space *.extra@space;

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }

    include nginx/conf/spaces/*.conf;
}
