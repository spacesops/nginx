# Fabric lookup sidecar locations (include inside server { }).

location = /_auth_verify {
    internal;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://fabric_lookup/auth/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
}

location /auth/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_pass http://fabric_lookup/auth/;
}

location /fabric/ {
    auth_request /_auth_verify;
    auth_request_set $verified_handle $upstream_http_x_verified_handle;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://fabric_lookup/;
}

location = /js/site.js {
    auth_request /_auth_verify;
    auth_request_set $verified_handle $upstream_http_x_verified_handle;
    add_header Cache-Control "no-store, must-revalidate";
    try_files $uri =404;
}

location @member_forbidden {
    default_type text/html;
    return 403 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Members</title></head><body><p>Access requires a verified @space handle for your Nostr key.</p><p><a href="/">Return to sign in</a></p></body></html>';
}
