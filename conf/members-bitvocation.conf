worker_processes  1;

error_log  logs/error.log;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    upstream fabric_lookup {
        server 127.0.0.1:8787;
        keepalive 8;
    }

    server {
        listen       8088;
        server_name  localhost;

        root   /Users/i830671/git/members-bitvocation;
        index  index.html;

        error_page 401 = @member_forbidden;
        error_page 403 = @member_forbidden;

        include fabric-gateway.conf;

        location ~* \.(html|css)$ {
            add_header Cache-Control "no-store, must-revalidate";
            try_files $uri =404;
        }

        # Public gate scripts (no auth_request)
        location ~ ^/js/(nostr-bridge|nip19|gate)\.js$ {
            add_header Cache-Control "no-store, must-revalidate";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
