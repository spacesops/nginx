# members@bitvocation (Spaces) + bitvocation.timeintosats.com (DNS)
# Included via root-nginx.conf: include nginx/conf/spaces/*.conf
# Same as conf/members@bitvocation.conf — keep both in sync when editing.

server {
    listen       80;
    server_name  members@bitvocation bitvocation.timeintosats.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen       443 ssl;
    server_name  members@bitvocation bitvocation.timeintosats.com;

    ssl_certificate     /etc/letsencrypt/live/bitvocation.timeintosats.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bitvocation.timeintosats.com/privkey.pem;

    root   /var/www/members-bitvocation;
    index  index.html;

    error_page 401 = @member_forbidden;
    error_page 403 = @member_forbidden;

    include nginx/conf/fabric-gateway.conf;

    location ~* \.(html|css)$ {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    location ~ ^/js/(nostr-bridge|nip19|gate)\.js$ {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
